<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#061510" />
    <title>CicadaFarm · Swarm</title>
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="stylesheet" href="game.css" />
    <script defer src="core.js"></script>
    <script defer src="fullscreen.js"></script>
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <header>
      <a href="https://cicadafarm.pages.dev/">↖ CICADAFARM</a
      ><a href="online.html" id="onlineLink" data-text="online"
        >◎ MULTIPLAYER ↗</a
      ><span class="brand">SWARM <i>01</i></span
      ><a href="agents.html" class="agent-link">AI ↗</a
      ><select id="language" aria-label="Language">
        <option value="en">EN</option>
        <option value="ru">RU</option>
        <option value="zh-CN">中文</option>
      </select>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="eyebrow" data-text="eyebrow"></p>
          <h1 data-text="title"></h1>
          <p data-text="subtitle"></p>
        </div>
        <div class="saved">
          <span data-text="farm"></span><strong id="level">01</strong
          ><small id="total"></small>
        </div>
      </section>
      <section class="arena">
        <canvas id="world" aria-label="CicadaFarm game arena"></canvas>
        <div class="hud">
          <div>
            <small data-text="mass"></small><strong id="mass">20</strong>
          </div>
          <div>
            <small data-text="cargo"></small><strong id="cargo">0 / 20</strong>
          </div>
          <div>
            <small data-text="harvest"></small><strong id="score">0</strong>
          </div>
          <div>
            <small data-text="time"></small><strong id="time">03:00</strong>
          </div>
          <div>
            <small data-text="weather"></small><strong id="weather"></strong>
          </div>
        </div>
        <aside id="profilePanel">
          <label id="nickLabel" for="nickname">Nickname</label
          ><input id="nickname" maxlength="20" placeholder="Cicada" /><label
            id="countryLabel"
            for="country"
            >Flag</label
          ><select id="country"></select
          ><label id="colorLabel" for="color">Colour</label
          ><input type="color" id="color" value="#c8ff91" /><label
            for="mode"
            data-text="mode"
          ></label
          ><select id="mode">
            <option value="free" id="freeOption">Free garden</option>
            <option value="daily" id="dailyOption">Garden of the day</option>
          </select>
        </aside>
        <section id="objectives" aria-label="Round objectives">
          <div>
            <span id="goalHarvest"></span
            ><progress id="harvestProgress" max="40" value="0"></progress>
          </div>
          <div>
            <span id="goalDelivery"></span
            ><progress id="deliveryProgress" max="3" value="0"></progress>
          </div>
          <div>
            <span id="goalRare"></span
            ><progress id="rareProgress" max="3" value="0"></progress>
          </div>
        </section>
        <div id="overlay">
          <div class="panel">
            <p class="eyebrow">CICADAFARM · SWARM</p>
            <h2 id="message"></h2>
            <p id="description"></p>
            <button id="start"></button
            ><button id="share" type="button" hidden></button>
            <p id="shareStatus" role="status"></p>
            <textarea
              id="shareFallback"
              readonly
              hidden
              aria-label="Share result"
            ></textarea
            ><small data-text="bots"></small>
          </div>
        </div>
        <div class="bottom">
          <span id="hint"></span
          ><button id="fullscreen" type="button" aria-pressed="false">
            ⛶ Full screen</button
          ><button id="pause" data-text="pause"></button>
        </div>
      </section>
      <section id="personalGarden">
        <div>
          <p class="eyebrow" data-text="personal"></p>
          <h2 id="gardenSummary"></h2>
          <p id="gardenDetail"></p>
        </div>
        <div>
          <p id="dailySummary"></p>
          <p id="nextUnlock"></p>
          <progress id="gardenProgress" max="100" value="0"></progress>
        </div>
      </section>
      <section class="guide">
        <article>
          <b>01</b>
          <h3 data-text="collect"></h3>
          <p data-text="collectDesc"></p>
        </article>
        <article>
          <b>02</b>
          <h3 data-text="deliver"></h3>
          <p data-text="deliverDesc"></p>
        </article>
        <article>
          <b>03</b>
          <h3 data-text="grow"></h3>
          <p data-text="growDesc"></p>
        </article>
      </section>
      <footer>
        <span data-text="local"></span
        ><a href="https://robotcyb.ai/">✧ ROBOTCYB ↗</a
        ><a href="https://cicadafarm.pages.dev/" data-text="market"></a>
      </footer>
      <p class="notice" data-text="tokens"></p>
      <p id="status" role="status" aria-live="polite" class="sr-only"></p>
    </main>
  </body>
</html>
