<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#061510" />
    <title>CicadaFarm · Shared Garden</title>
    <link rel="icon" href="../assets/favicon.png" />
    <link rel="stylesheet" href="game.css" />
    <script defer src="core.js"></script>
    <script defer src="fullscreen.js"></script>
    <script type="module" src="online.js"></script>
  </head>
  <body>
    <header>
      <a href="https://cicadafarm.pages.dev/">↖ CICADAFARM</a
      ><span class="brand">SWARM <i>01</i></span
      ><a href="agents.html" class="agent-link">AI ↗</a
      ><select id="language" aria-label="Language">
        <option value="en">EN</option>
        <option value="ru">RU</option>
        <option value="zh-CN">中文</option>
      </select>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="eyebrow" data-text="eyebrow"></p>
          <h1 data-text="title"></h1>
          <p data-text="subtitle"></p>
        </div>
        <div class="saved">
          <span data-text="farm"></span><strong id="level">01</strong
          ><small id="total"></small>
        </div>
      </section>
      <section class="arena">
        <canvas id="world" aria-label="CicadaFarm game arena"></canvas>
        <div class="hud">
          <div>
            <small data-text="mass"></small><strong id="mass">20</strong>
          </div>
          <div>
            <small data-text="cargo"></small><strong id="cargo">0 / 20</strong>
          </div>
          <div>
            <small data-text="harvest"></small><strong id="score">0</strong>
          </div>
          <div>
            <small data-text="time"></small><strong id="time">03:00</strong>
          </div>
          <div>
            <small data-text="weather"></small><strong id="weather"></strong>
          </div>
        </div>
        <aside id="roomPanel">
          <label id="nickLabel" for="nickname">Nickname</label
          ><input id="nickname" maxlength="20" placeholder="Cicada" /><label
            id="roomLabel"
            for="room"
            >Garden</label
          ><select id="room">
            <option value="1">01</option>
            <option value="2">02</option>
            <option value="3">03</option>
            <option value="4">04</option>
            <option value="5">05</option>
            <option value="6">06</option>
            <option value="7">07</option>
            <option value="8">08</option>
            <option value="9">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option></select
          ><label id="countryLabel" for="country">Flag</label
          ><select id="country"></select
          ><label id="colorLabel" for="color">Colour</label
          ><input type="color" id="color" value="#c8ff91" /><button id="invite">
            Invite ↗</button
          ><a href="./" id="soloLink">Solo ↗</a>
        </aside>
        <div id="overlay">
          <div class="panel">
            <p class="eyebrow">CICADAFARM · SWARM</p>
            <h2 id="message"></h2>
            <p id="description"></p>
            <button id="start"></button><small data-text="bots"></small>
          </div>
        </div>
        <div class="bottom">
          <span id="hint"></span
          ><button id="fullscreen" type="button" aria-pressed="false">
            ⛶ Full screen</button
          ><button id="pause" data-text="pause"></button>
        </div>
      </section>
      <section class="guide">
        <article>
          <b>01</b>
          <h3 data-text="collect"></h3>
          <p data-text="collectDesc"></p>
        </article>
        <article>
          <b>02</b>
          <h3 data-text="deliver"></h3>
          <p data-text="deliverDesc"></p>
        </article>
        <article>
          <b>03</b>
          <h3 data-text="grow"></h3>
          <p data-text="growDesc"></p>
        </article>
      </section>
      <footer>
        <span data-text="local"></span
        ><a href="https://robotcyb.ai/">✧ ROBOTCYB ↗</a
        ><a href="https://cicadafarm.pages.dev/" data-text="market"></a>
      </footer>
      <p class="notice" data-text="tokens"></p>
      <section id="leaderboard" class="guide"></section>
      <p id="status" role="status" aria-live="polite" class="sr-only"></p>
    </main>
  </body>
</html>
